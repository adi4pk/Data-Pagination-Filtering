<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Student List</title>
  <link href="css/reset.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>


  <div class="modal-wrapper hide">
        <div class="modal">
          <div class="name-section">
            <div class="first">
              <p>First name</p>
              <input type="textbox" class="first-box">
            </div>
            
            <div class="last">
              <p>Last Name</p>
              <input type="textbox" class="last-box">
            </div>
            
          </div>
          
          <p>email</p>
          <input type="email" class="email-box">
          <p>date of birth</p>
          <div class="button-section">
            <button class="saveStd btn">add student</button>
            <button class="discardStd btn">discard</button>
          </div>
          
         


        </div>
  </div>

  <div class="student-modal-container hide">
    <button class="left-arrow arrow">←</button>
    <div class="student-modal">
      
      <div class="name-section name-student">
            
              <p class="std-first">First name</p>
              <p class="std-last">Last Name</p>
            
      </div>
          
          <p class="std-email">Email: </p>
          <p class="std-joindate">Joined in: </p>
    </div>
    <button class="right-arrow arrow">→</button>

  </div>


  <div class="page">

    <header class="header">
      <h2>Students</h2>
      
        <!-- Extra Credit: Dynamically insert search form here  
        
          EXAMPLE - Search form: -->

      <p class="add-student-btn">Add Student</p>
          <label for="search" class="student-search">
            <input id="search" placeholder="Search by name...">
            <button type="button"><img src="img/icn-search.svg" alt="Search icon"></button>
          </label>
        
        

    </header>

    
    
    <ul class="student-list">

      <!-- Dynamically insert students here
        
        EXAMPLE - Student list item:

        <li class="student-item cf">
          <div class="student-details">
            <img class="avatar" src="https://randomuser.me/api/portraits/women/25.jpg" alt="Profile Picture">
            <h3>Ethel Dean</h3>
            <span class="email">ethel.dean@example.com</span>
          </div>
          <div class="joined-details">
            <span class="date">Joined 12-15-2005</span>
          </div>
        </li>

      -->
        
    </ul>

    <div class="pagination">
      <ul class="link-list">

        <!-- Dynamically insert pagination buttons here

          EXAMPLE - Two pagination buttons, one with active class, one without:
            
          <li>
            <button type="button" class="active">1</button>
          </li>
          <li>
            <button type="button">2</button>
          </li>
      
        -->

      </ul>
    </div>
    
  </div>
  <script src="js/data.js"></script> 
  <script src="js/script.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
